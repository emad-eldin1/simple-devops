name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to both registries
        run: |
          DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/simple-devops
          GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          SHA=${GITHUB_SHA::7}

          docker build \
            -t $DOCKERHUB_IMAGE:latest \
            -t $DOCKERHUB_IMAGE:$SHA \
            -t $GHCR_IMAGE:latest \
            -t $GHCR_IMAGE:$SHA .

          docker push $DOCKERHUB_IMAGE:latest
          docker push $DOCKERHUB_IMAGE:$SHA
          docker push $GHCR_IMAGE:latest
          docker push $GHCR_IMAGE:$SHA

          {
            echo "### Images published"
            echo "- docker.io/$DOCKERHUB_IMAGE:latest"
            echo "- docker.io/$DOCKERHUB_IMAGE:$SHA"
            echo "- $GHCR_IMAGE:latest"
            echo "- $GHCR_IMAGE:$SHA"
          } >> "$GITHUB_STEP_SUMMARY" 
